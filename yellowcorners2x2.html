<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Corners 2x2 | The Cuber</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon: #00ffff;
            --neon-soft: rgba(0,255,255,0.6);
            --bg-dark: #050505;
            --panel-dark: #0b0b0b;
            --text-main: #e6ffff;
            --text-muted: #9adede;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D0D0D, #1A1A1A);
            color: var(--text-main);
            line-height: 1.7;
        }

        header {
            padding: 30px 40px;
            border-bottom: 1px solid rgba(0,255,255,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--neon);
            text-shadow: 0 0 12px var(--neon-soft);
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            color: var(--text-muted);
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px 80px;
        }

        section {
            background: linear-gradient(180deg, #0c0c0c, #070707);
            border: 1px solid rgba(0,255,255,0.12);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(0,255,255,0.05);
        }

        section h2 {
            margin-top: 0;
            color: var(--neon);
            text-shadow: 0 0 8px var(--neon-soft);
            border-bottom: 1px solid rgba(0,255,255,0.2);
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }

        h3 {
            margin-top: 20px;
            color: var(--neon-soft);
        }

        p {
            color: var(--text-main);
        }

        ul, ol {
            padding-left: 22px;
        }

        li {
            margin: 8px 0;
            color: var(--text-muted);
        }

        .example {
            margin-top: 15px;
            padding: 16px 18px;
            background: rgba(0,255,255,0.06);
            border-left: 4px solid var(--neon);
            border-radius: 6px;
            font-size: 20px;
        }

        .example p {
            margin: 6px 0;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        .nav-buttons a {
            display: inline-block;
            padding: 12px 26px;
            color: var(--neon);
            text-decoration: none;
            border: 1px solid var(--neon);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transition: all 0.2s ease;
        }

        .nav-buttons a:hover {
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 25px rgba(0,255,255,0.6);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            border-top: 1px solid rgba(0,255,255,0.15);
        }

        .logo {
            font-size: 42px;
            font-family: 'Orbitron', sans-serif;
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
            cursor: default;
        }

        li.logo a {
            text-decoration: none;
            color: inherit;
            font-weight: bold;
        }

        li.logo {
            list-style: none;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
  <li class="logo"><a href="index.html">The Cuber</a></li>
  </nav>
    <p>Beginner Guide — Yellow Corners 2x2 🌼</p>
</header>

<main>

<header>

</header>

</main>

<footer>
    <p>© The Cuber — 2x2 Beginner Series 🌼</p>
</footer>

</body>
</html>
